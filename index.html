<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทดลองซิงค์ iPhone (ต้นแบบทิ้ง)</title>
<style>
  :root { color-scheme: light dark; --b:#8884; --ok:#1a7f37; --bad:#c62828; --warn:#b26a00; }
  * { box-sizing: border-box; }
  body { font: 16px/1.45 -apple-system, system-ui, sans-serif; margin: 0; padding: 12px 12px 80px; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 18px; margin: 4px 0 8px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  section { border: 1px solid var(--b); border-radius: 10px; padding: 10px; margin: 10px 0; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--b); background: #8881; margin: 4px 4px 4px 0; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  input, textarea { font: inherit; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--b); background: transparent; color: inherit; }
  textarea { font-family: ui-monospace, monospace; font-size: 12px; height: 70px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > input { flex: 1; }
  .hidden { display: none !important; }
  .muted { opacity: .7; font-size: 13px; }
  #qr svg { width: 100%; max-width: 360px; height: auto; background: #fff; display: block; margin: 8px auto; }
  video { width: 100%; max-height: 50vh; background: #000; border-radius: 8px; }
  #peers div, #log div, #chat div { padding: 3px 0; border-bottom: 1px dashed var(--b); font-size: 13px; }
  #chat div { font-size: 15px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  #log { max-height: 260px; overflow: auto; font-family: ui-monospace, monospace; }
  .badge { display:inline-block; padding: 1px 8px; border-radius: 99px; border:1px solid currentColor; font-size: 12px; }
</style>
</head>
<body>
<h1>ทดลองซิงค์ iPhone ผ่าน hotspot <span class="badge warn">ต้นแบบทิ้ง</span></h1>

<section id="setup">
  <h2>1) ตั้งค่าเครื่องนี้</h2>
  <div class="row"><input id="devName" placeholder="ชื่อเครื่อง เช่น A, B, C"></div>
  <div style="margin-top:8px">
    <button class="primary" data-role="host">เป็นเครื่องแม่</button>
    <button class="primary" data-role="guest">เป็นเครื่องลูก</button>
  </div>
  <p class="muted">ระบบจะขอสิทธิ์กล้องก่อน (ใช้สแกน QR และช่วยให้ Safari เปิดเผย IP ในวง)</p>
</section>

<section id="main" class="hidden">
  <h2 id="roleTitle"></h2>
  <div id="hostCtl" class="hidden">
    <button class="primary" id="btnNewGuest">+ เพิ่มเครื่องลูก (แสดง QR)</button>
    <button id="btnScanAnswer" class="hidden">สแกน QR คำตอบจากเครื่องลูก</button>
  </div>
  <div id="guestCtl" class="hidden">
    <button class="primary" id="btnScanOffer">สแกน QR จากเครื่องแม่</button>
  </div>
  <div id="qrBox" class="hidden">
    <p id="qrHint" class="muted"></p>
    <div id="qr"></div>
    <details><summary class="muted">รหัสแบบข้อความ (สำหรับทดสอบบนคอม)</summary>
      <textarea id="codeOut" readonly></textarea>
    </details>
  </div>
  <div id="scanBox" class="hidden">
    <video id="video" playsinline muted></video>
    <button id="btnStopScan">หยุดสแกน</button>
  </div>
  <details style="margin-top:6px"><summary class="muted">วางรหัสแทนการสแกน</summary>
    <textarea id="codeIn" placeholder="วางรหัส O:... หรือ A:..."></textarea>
    <button id="btnUseCode">ใช้รหัสนี้</button>
  </details>
  <div style="margin-top:6px">
    <button id="btnWake">เปิดกันจอดับ</button>
    <span id="wakeState" class="muted"></span>
  </div>
</section>

<section id="peersSec" class="hidden">
  <h2>การเชื่อมต่อ</h2>
  <div id="peers"></div>
</section>

<section id="chatSec" class="hidden">
  <h2>2) ส่งข้อความทดสอบ</h2>
  <div class="row"><input id="msg" placeholder="พิมพ์ เช่น โควตา 1234 ลงแล้ว"><button class="primary" id="btnSend">ส่ง</button></div>
  <div id="chat"></div>
</section>

<section>
  <h2>บันทึกเหตุการณ์ <button id="btnCopyLog" style="padding:4px 8px;font-size:12px">คัดลอก</button></h2>
  <div id="log"></div>
</section>

<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const t0 = performance.now();
  const stamp = () => new Date().toLocaleTimeString('th-TH', { hour12: false }) + '.' + String(Date.now() % 1000).padStart(3, '0');
  const logLines = [];
  function log(text, cls) {
    const line = `[${stamp()}] ${text}`;
    logLines.push(line);
    const d = document.createElement('div');
    d.textContent = line; if (cls) d.className = cls;
    $('log').prepend(d);
    console.log('[spike]', line);
  }

  let role = null, myName = '', camStream = null;
  const peers = new Map();       // id -> {id, pc, dc, name, state, lastPong, rtt}
  let pendingHostPeer = null;     // host: peer waiting for answer
  const seenMsg = new Set();

  // ---------- encoding SDP <-> short code ----------
  const b64u = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64u = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  async function pipe(bytes, stream) {
    const out = new Response(new Blob([bytes]).stream().pipeThrough(stream));
    return new Uint8Array(await out.arrayBuffer());
  }
  function slimSdp(sdp) {
    // drop lines not needed for a host-only data channel
    return sdp.split('\r\n').filter(l => l && !/^a=(extmap|rtcp-fb|ssrc|msid)/.test(l)).join('\r\n') + '\r\n';
  }
  async function encode(kind, sdp) {
    const raw = new TextEncoder().encode(slimSdp(sdp));
    if (typeof CompressionStream !== 'undefined') {
      try { return kind + 'z:' + b64u(await pipe(raw, new CompressionStream('deflate-raw'))); } catch (e) { log('บีบอัดไม่ได้: ' + e.message, 'warn'); }
    }
    return kind + ':' + b64u(raw);
  }
  async function decode(code) {
    code = code.trim();
    const m = /^([OA])(z?):(.+)$/s.exec(code);
    if (!m) throw new Error('รูปแบบรหัสไม่ถูกต้อง');
    let bytes = unb64u(m[3]);
    if (m[2] === 'z') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
    return { kind: m[1], sdp: new TextDecoder().decode(bytes) };
  }

  // ---------- peer connection ----------
  function describeCandidates(sdp) {
    return sdp.split('\r\n').filter(l => l.startsWith('a=candidate')).map(l => {
      const p = l.split(' '); return `${p[2]}/${p[7]} ${p[4]}:${p[5]}`;
    });
  }
  function newPeer() {
    const id = Math.random().toString(36).slice(2, 7);
    const pc = new RTCPeerConnection({ iceServers: [] });
    const peer = { id, pc, dc: null, name: '?', state: 'new', lastPong: 0, rtt: null };
    pc.onconnectionstatechange = () => { peer.state = pc.connectionState; log(`[${peer.name}/${id}] connection=${pc.connectionState}`, pc.connectionState === 'connected' ? 'ok' : (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') ? 'bad' : ''); renderPeers(); };
    pc.oniceconnectionstatechange = () => log(`[${peer.name}/${id}] ice=${pc.iceConnectionState}`);
    pc.onicecandidate = (e) => { if (e.candidate) log(`[${id}] candidate ${e.candidate.candidate.split(' ').slice(4, 8).join(' ')}`); };
    peers.set(id, peer);
    return peer;
  }
  function waitGather(pc, ms = 4000) {
    if (pc.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise(res => {
      const done = () => { pc.removeEventListener('icegatheringstatechange', chk); res(); };
      const chk = () => { if (pc.iceGatheringState === 'complete') done(); };
      pc.addEventListener('icegatheringstatechange', chk);
      setTimeout(done, ms);
    });
  }
  function bindChannel(peer, dc) {
    peer.dc = dc;
    dc.onopen = () => { log(`[${peer.id}] data channel เปิดแล้ว`, 'ok'); send(peer, { type: 'hello', name: myName }); renderPeers(); };
    dc.onclose = () => { log(`[${peer.name}/${peer.id}] data channel ปิด`, 'bad'); renderPeers(); };
    dc.onerror = (e) => log(`[${peer.id}] dc error ${e.error ? e.error.message : ''}`, 'bad');
    dc.onmessage = (e) => onMessage(peer, JSON.parse(e.data));
  }
  function send(peer, obj) { if (peer.dc && peer.dc.readyState === 'open') peer.dc.send(JSON.stringify(obj)); }
  function broadcast(obj, exceptId) { for (const p of peers.values()) if (p.id !== exceptId) send(p, obj); }

  function onMessage(peer, m) {
    if (m.type === 'hello') { peer.name = m.name || '?'; log(`[${peer.id}] รู้จักกันแล้ว: ${peer.name}`, 'ok'); renderPeers(); return; }
    if (m.type === 'ping') { send(peer, { type: 'pong', t: m.t }); return; }
    if (m.type === 'pong') { peer.lastPong = Date.now(); peer.rtt = Math.round(performance.now() - m.t); renderPeers(); return; }
    if (m.type === 'chat') {
      if (seenMsg.has(m.id)) return; seenMsg.add(m.id);
      showChat(m, false);
      if (role === 'host') broadcast(m, peer.id); // relay to other guests
    }
  }
  function showChat(m, mine) {
    const d = document.createElement('div');
    const lag = Date.now() - m.ts;
    d.innerHTML = `<b></b> <span></span> <span class="muted"></span>`;
    d.children[0].textContent = (mine ? 'ฉัน' : m.from) + ':';
    d.children[1].textContent = m.text;
    d.children[2].textContent = mine ? '' : `(ถึงใน ~${lag} ms)`;
    $('chat').prepend(d);
  }

  setInterval(() => { for (const p of peers.values()) send(p, { type: 'ping', t: performance.now() }); renderPeers(); }, 2000);

  function renderPeers() {
    const box = $('peers'); box.innerHTML = '';
    if (!peers.size) { box.innerHTML = '<div class="muted">ยังไม่มี</div>'; return; }
    for (const p of peers.values()) {
      const alive = p.lastPong && Date.now() - p.lastPong < 5000;
      const d = document.createElement('div');
      d.className = alive ? 'ok' : (p.state === 'connected' ? 'warn' : 'bad');
      d.textContent = `${p.name} (${p.id}) — ${p.state}, ช่อง=${p.dc ? p.dc.readyState : '-'}, ${alive ? 'ตอบสนอง ' + p.rtt + ' ms' : 'ไม่ตอบสนอง'}`;
      box.appendChild(d);
    }
  }

  // ---------- QR show / scan ----------
  function showCode(code, hint) {
    const qr = qrcode(0, 'L'); qr.addData(code, 'Byte'); qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
    $('codeOut').value = code;
    $('qrHint').textContent = `${hint} (ยาว ${code.length} ตัวอักษร, QR ขนาด ${qr.getModuleCount()} ช่อง)`;
    $('qrBox').classList.remove('hidden');
    log(`แสดง QR ยาว ${code.length} ตัวอักษร`);
  }
  let scanning = false;
  async function scan() {
    $('scanBox').classList.remove('hidden');
    const video = $('video');
    if (!camStream) camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = camStream; await video.play();
    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { willReadFrequently: true });
    scanning = true;
    return new Promise((resolve, reject) => {
      const tick = () => {
        if (!scanning) { reject(new Error('หยุดสแกน')); return; }
        if (video.readyState >= 2) {
          const w = Math.min(800, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
          canvas.width = w; canvas.height = h; ctx.drawImage(video, 0, 0, w, h);
          const res = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
          if (res && /^[OA]z?:/.test(res.data)) { scanning = false; $('scanBox').classList.add('hidden'); resolve(res.data); return; }
        }
        requestAnimationFrame(tick);
      };
      tick();
    });
  }
  $('btnStopScan').onclick = () => { scanning = false; $('scanBox').classList.add('hidden'); };

  // ---------- flows ----------
  async function hostNewGuest() {
    if (pendingHostPeer && pendingHostPeer.state === 'new') { pendingHostPeer.pc.close(); peers.delete(pendingHostPeer.id); }
    const peer = newPeer(); pendingHostPeer = peer;
    bindChannel(peer, peer.pc.createDataChannel('sync', { ordered: true }));
    await peer.pc.setLocalDescription(await peer.pc.createOffer());
    await waitGather(peer.pc);
    const sdp = peer.pc.localDescription.sdp;
    log(`offer candidates: ${describeCandidates(sdp).join(' | ') || 'ไม่มี!'}`, describeCandidates(sdp).length ? '' : 'bad');
    showCode(await encode('O', sdp), 'ให้เครื่องลูกสแกน QR นี้');
    $('btnScanAnswer').classList.remove('hidden');
    renderPeers();
  }
  async function hostApplyAnswer(code) {
    const { kind, sdp } = await decode(code);
    if (kind !== 'A') throw new Error('นี่ไม่ใช่รหัสคำตอบ (A:)');
    if (!pendingHostPeer) throw new Error('ยังไม่ได้กด เพิ่มเครื่องลูก');
    log(`answer candidates: ${describeCandidates(sdp).join(' | ') || 'ไม่มี!'}`);
    await pendingHostPeer.pc.setRemoteDescription({ type: 'answer', sdp });
    pendingHostPeer = null;
    $('qrBox').classList.add('hidden'); $('btnScanAnswer').classList.add('hidden');
    log('ใส่คำตอบแล้ว รอเชื่อมต่อ…');
  }
  async function guestApplyOffer(code) {
    const { kind, sdp } = await decode(code);
    if (kind !== 'O') throw new Error('นี่ไม่ใช่รหัสจากเครื่องแม่ (O:)');
    for (const p of peers.values()) { p.pc.close(); } peers.clear(); // guest has one host
    const peer = newPeer(); peer.name = 'เครื่องแม่';
    peer.pc.ondatachannel = (e) => bindChannel(peer, e.channel);
    log(`offer candidates: ${describeCandidates(sdp).join(' | ') || 'ไม่มี!'}`);
    await peer.pc.setRemoteDescription({ type: 'offer', sdp });
    await peer.pc.setLocalDescription(await peer.pc.createAnswer());
    await waitGather(peer.pc);
    showCode(await encode('A', peer.pc.localDescription.sdp), 'ให้เครื่องแม่กด "สแกน QR คำตอบ" แล้วสแกน QR นี้');
    renderPeers();
  }
  const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { log('ผิดพลาด: ' + e.message, 'bad'); } };

  document.querySelectorAll('[data-role]').forEach(b => b.onclick = guard(async () => {
    myName = $('devName').value.trim() || (b.dataset.role === 'host' ? 'แม่' : 'ลูก');
    role = b.dataset.role;
    try { camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); log('ได้สิทธิ์กล้องแล้ว', 'ok'); }
    catch (e) { log('ไม่ได้สิทธิ์กล้อง: ' + e.message + ' (ยังวางรหัสแทนได้)', 'warn'); }
    $('setup').classList.add('hidden'); $('main').classList.remove('hidden');
    $('peersSec').classList.remove('hidden'); $('chatSec').classList.remove('hidden');
    $('roleTitle').textContent = (role === 'host' ? 'เครื่องแม่: ' : 'เครื่องลูก: ') + myName;
    $(role === 'host' ? 'hostCtl' : 'guestCtl').classList.remove('hidden');
    log(`เริ่มเป็น ${role} ชื่อ ${myName} | UA: ${navigator.userAgent}`);
    renderPeers();
  }));
  $('btnNewGuest').onclick = guard(hostNewGuest);
  $('btnScanAnswer').onclick = guard(async () => hostApplyAnswer(await scan()));
  $('btnScanOffer').onclick = guard(async () => guestApplyOffer(await scan()));
  $('btnUseCode').onclick = guard(async () => {
    const code = $('codeIn').value; $('codeIn').value = '';
    if (role === 'host') await hostApplyAnswer(code); else await guestApplyOffer(code);
  });
  $('btnSend').onclick = () => {
    const text = $('msg').value.trim(); if (!text) return;
    const m = { type: 'chat', id: Math.random().toString(36).slice(2), from: myName, text, ts: Date.now() };
    seenMsg.add(m.id); broadcast(m); showChat(m, true); $('msg').value = '';
  };
  $('msg').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnSend').click(); });

  let wakeLock = null;
  $('btnWake').onclick = guard(async () => {
    if (!('wakeLock' in navigator)) { $('wakeState').textContent = 'เครื่องนี้ไม่รองรับ'; log('ไม่รองรับ Wake Lock', 'warn'); return; }
    wakeLock = await navigator.wakeLock.request('screen');
    $('wakeState').textContent = 'เปิดอยู่'; log('เปิดกันจอดับแล้ว', 'ok');
    wakeLock.addEventListener('release', () => { $('wakeState').textContent = 'ถูกปล่อย'; log('กันจอดับถูกปล่อย', 'warn'); });
  });
  document.addEventListener('visibilitychange', () => {
    log('หน้าเว็บ ' + (document.hidden ? 'ถูกซ่อน (จอดับ/สลับแอป)' : 'กลับมาแสดง'), document.hidden ? 'warn' : '');
    if (!document.hidden && wakeLock && wakeLock.released) $('btnWake').click();
  });
  $('btnCopyLog').onclick = async () => { try { await navigator.clipboard.writeText(logLines.join('\n')); log('คัดลอกบันทึกแล้ว', 'ok'); } catch (e) { log('คัดลอกไม่ได้: ' + e.message, 'bad'); } };

  log(`โหลดหน้าแล้ว | RTCPeerConnection=${typeof RTCPeerConnection !== 'undefined'} | CompressionStream=${typeof CompressionStream !== 'undefined'} | HTTPS=${location.protocol === 'https:'}`);
})();
</script>
</body>
</html>
